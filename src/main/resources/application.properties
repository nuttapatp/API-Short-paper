server.port=8082
spring.application.name=aqi-notification-service
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [rid=%X{requestId}] %-5level %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=aqi-notification-service
info.app.description=LINE AQI notification service
